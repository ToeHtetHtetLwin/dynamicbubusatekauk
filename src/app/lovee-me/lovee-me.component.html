<canvas #threeCanvas class="fixed top-0 left-0 w-full h-full -z-10 pointer-events-none"></canvas>

<div class="min-h-screen flex flex-col items-center justify-center bg-gray-50 p-4 font-sans overflow-hidden select-none">
  
  <div class="main-card bg-white/90 backdrop-blur-md p-12 rounded-[2.5rem] shadow-xl text-center max-w-xl w-full flex flex-col items-center justify-center border border-gray-100 transition-all duration-300">
    
    <div class="w-60 h-60 mb-8 flex items-center justify-center overflow-hidden rounded-3xl bg-gray-50/50">
      <!-- public folder ထဲက ပုံကို root path အနေနဲ့ တိုက်ရိုက် ခေါ်သုံးထားပါတယ် -->
      <img *ngIf="currentGif" [src]="'/' + currentGif" alt="Cute Status GIF" class="max-w-full max-h-full object-contain">
    </div>

    <h1 class="header-text text-4xl font-extrabold text-gray-800 mb-12 tracking-wide block min-h-[48px]">
      {{ currentText }}
    </h1>

    <div class="flex items-center justify-center gap-8 w-full min-h-[220px] px-4">
      
      <p-button 
        *ngIf="!isAccepted"
        (onClick)="onYesAction($event)"
        (onMouseEnter)="onYesAction($event)"
        severity="success"
        styleClass="yes-btn px-14 py-6 text-3xl font-bold rounded-full shadow-xl shadow-emerald-200/60 transform active:scale-95 transition-all duration-200 z-10 min-w-[180px]"
        label="YES ❤️">
      </p-button>

      <p-button 
        (onClick)="onNoClick($event)"
        severity="danger"
        styleClass="no-btn px-14 py-6 text-3xl font-bold rounded-full shadow-xl shadow-rose-200/60 transform active:scale-95 transition-all duration-200 z-20 min-w-[180px]"
        label="No">
      </p-button>

    </div>
  </div>
</div>
