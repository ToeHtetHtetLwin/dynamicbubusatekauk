<canvas #threeCanvas class="fixed top-0 left-0 w-full h-full -z-10 pointer-events-none"></canvas>

<div class="min-h-screen flex flex-col items-center justify-center bg-gray-50 p-4 font-sans overflow-hidden select-none">
  
  <div class="main-card bg-white/90 backdrop-blur-md p-6 md:p-12 rounded-[2.5rem] shadow-xl text-center max-w-xl w-full flex flex-col items-center justify-center border border-gray-100 transition-all duration-300 overflow-visible">
    
    <!-- GIF Image -->
    <div class="w-44 h-44 md:w-60 md:h-60 mb-6 flex items-center justify-center overflow-hidden rounded-3xl bg-gray-50/50 shrink-0">
      <img *ngIf="currentGif" [src]="getGifUrl(currentGif)" alt="Cute Status GIF" class="max-w-full max-h-full object-contain">
    </div>

    <!-- Header Text -->
    <h1 class="header-text font-extrabold text-gray-800 mb-6 md:mb-10 tracking-wide block relative z-30 transition-all duration-300"
        [ngClass]="isAccepted ? 'text-base sm:text-lg font-normal leading-relaxed mb-4 min-h-[40px]' : 'text-2xl md:text-4xl min-h-[56px]'">
      {{ currentText }}
    </h1>

    <!-- Buttons Wrapper -->
    <div class="relative flex items-center justify-center gap-4 md:gap-8 w-full px-2 md:px-4 rounded-2xl transition-all duration-300 overflow-visible"
         [ngClass]="isAccepted ? 'min-h-[70px]' : 'min-h-[180px] md:min-h-[220px]'">
      
      <!-- Dynamic YES Button -->
      <p-button 
        *ngIf="!isAccepted"
        (onClick)="onYesAction($event)"
        severity="success"
        styleClass="yes-btn px-6 py-3 md:px-10 md:py-5 text-lg md:text-2xl font-bold rounded-full shadow-xl shadow-emerald-200/60 transform active:scale-95 transition-all duration-200 z-20 min-w-[110px] md:min-w-[160px] shrink-0"
        [label]="yesButtonLabel">
      </p-button>

      <!-- Dynamic NO Button (ကြီးလာတဲ့အခါ YES ခလုတ်ပေါ် ဖုံးသွားစေရန် z-40 ထားထားသည်) -->
      <p-button 
        *ngIf="!isAccepted"
        (onClick)="onNoClick($event)"
        (onMouseEnter)="onNoHover($event)"
        severity="danger"
        styleClass="no-btn px-6 py-3 md:px-10 md:py-5 text-lg md:text-2xl font-bold rounded-full shadow-xl shadow-rose-200/60 transform active:scale-95 transition-all duration-200 z-40 min-w-[110px] md:min-w-[160px] shrink-0"
        [label]="noButtonLabel">
      </p-button>

    </div>
  </div>
</div>
