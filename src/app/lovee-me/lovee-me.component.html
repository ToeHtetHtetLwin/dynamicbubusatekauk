<canvas #threeCanvas class="fixed top-0 left-0 w-full h-full -z-10 pointer-events-none"></canvas>

<div class="min-h-screen flex flex-col items-center justify-center bg-gray-50 p-4 font-sans overflow-hidden select-none">
  
  <!-- ဖုန်းမှာ p-6 ဖြစ်ပြီး ကွန်ပျူတာမှာ p-12 ဖြစ်အောင် md:p-12 ပြောင်းထားပါတယ် -->
  <div class="main-card bg-white/90 backdrop-blur-md p-6 md:p-12 rounded-[2.5rem] shadow-xl text-center max-w-xl w-full flex flex-col items-center justify-center border border-gray-100 transition-all duration-300">
    
    <!-- ပုံအရွယ်အစားကို ဖုန်းမှာ w-44 h-44၊ ကွန်ပျူတာမှာ md:w-60 md:h-60 ဆိုပြီး ညှိထားပါတယ် -->
    <div class="w-44 h-44 md:w-60 md:h-60 mb-8 flex items-center justify-center overflow-hidden rounded-3xl bg-gray-50/50">
      <img *ngIf="currentGif" [src]="'/' + currentGif" alt="Cute Status GIF" class="max-w-full max-h-full object-contain">
    </div>

    <!-- ခေါင်းစဉ်စာသားကို ဖုန်းမှာ text-2xl၊ ကွန်ပျူတာမှာ md:text-4xl ပြောင်းထားပါတယ် -->
    <h1 class="header-text text-2xl md:text-4xl font-extrabold text-gray-800 mb-8 md:mb-12 tracking-wide block min-h-[48px]">
      {{ currentText }}
    </h1>

    <!-- ခလုတ်တွေရဲ့ နေရာလွတ် (Gap) ကို ဖုန်းမှာ gap-4၊ ကွန်ပျူတာမှာ md:gap-8 ညှိထားပါတယ် -->
    <div class="flex items-center justify-center gap-4 md:gap-8 w-full min-h-[180px] md:min-h-[220px] px-2 md:px-4">
      
      <!-- ခလုတ်စာသားကို ဖုန်းမှာ text-xl px-8 py-4၊ ကွန်ပျူတာမှာ md:text-3xl md:px-14 md:py-6 လို့ ပြောင်းထားပါတယ် -->
      <p-button 
        *ngIf="!isAccepted"
        (onClick)="onYesAction($event)"
        (onMouseEnter)="onYesAction($event)"
        severity="success"
        styleClass="yes-btn px-8 py-4 md:px-14 md:py-6 text-xl md:text-3xl font-bold rounded-full shadow-xl shadow-emerald-200/60 transform active:scale-95 transition-all duration-200 z-10 min-w-[120px] md:min-w-[180px]"
        label="YES ❤️">
      </p-button>

      <p-button 
        (onClick)="onNoClick($event)"
        severity="danger"
        styleClass="no-btn px-8 py-4 md:px-14 md:py-6 text-xl md:text-3xl font-bold rounded-full shadow-xl shadow-rose-200/60 transform active:scale-95 transition-all duration-200 z-20 min-w-[120px] md:min-w-[180px]"
        label="No">
      </p-button>

    </div>
  </div>
</div>
