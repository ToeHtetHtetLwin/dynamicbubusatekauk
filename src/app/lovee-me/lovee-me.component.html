<canvas #threeCanvas class="fixed top-0 left-0 w-full h-full -z-10 pointer-events-none"></canvas>

<div class="min-h-screen flex flex-col items-center justify-center bg-gray-50 p-4 font-sans overflow-hidden select-none">
  
  <div class="main-card bg-white/90 backdrop-blur-md p-6 md:p-12 rounded-[2.5rem] shadow-xl text-center max-w-xl w-full flex flex-col items-center justify-center border border-gray-100 transition-all duration-300">
    
    <!-- GIF Image -->
    <div class="w-44 h-44 md:w-60 md:h-60 mb-6 flex items-center justify-center overflow-hidden rounded-3xl bg-gray-50/50 shrink-0">
      <img *ngIf="currentGif" [src]="'/' + currentGif" alt="Cute Status GIF" class="max-w-full max-h-full object-contain">
    </div>

    <!-- Header Text -->
    <h1 class="header-text text-2xl md:text-4xl font-extrabold text-gray-800 mb-6 md:mb-10 tracking-wide block min-h-[56px] relative z-30">
      {{ currentText }}
    </h1>

    <!-- Buttons Wrapper -->
    <div class="relative flex items-center justify-center gap-4 md:gap-8 w-full min-h-[160px] md:min-h-[190px] px-2 md:px-4 overflow-hidden rounded-2xl">
      
      <!-- YES Button (ဆိုးတယ်) -->
      <p-button 
        *ngIf="!isAccepted"
        (onClick)="onYesAction($event)"
        severity="success"
        styleClass="yes-btn px-6 py-3 md:px-10 md:py-5 text-lg md:text-2xl font-bold rounded-full shadow-xl shadow-emerald-200/60 transform active:scale-95 transition-all duration-200 z-10 min-w-[100px] md:min-w-[150px] shrink-0"
        label="ဆိုးတယ်">
      </p-button>

      <!-- NO Button (မဆိုးဘူး) -->
      <p-button 
        *ngIf="!isAccepted && showNoButton"
        (onClick)="onNoClick($event)"
        severity="danger"
        styleClass="no-btn px-6 py-3 md:px-10 md:py-5 text-lg md:text-2xl font-bold rounded-full shadow-xl shadow-rose-200/60 transform active:scale-95 transition-all duration-200 z-20 min-w-[100px] md:min-w-[150px] shrink-0"
        label="မဆိုးဘူး">
      </p-button>

    </div>
  </div>
</div>
